name: Scrape

# Layer 2 — the scraper. Runs on a daily schedule as a fallback sweep, and
# on demand: manually (workflow_dispatch), from the RSS watcher
# (rss-watch.yml triggers it via `gh workflow run`), from reusable calls, or
# from ANY external watcher via the repository_dispatch API (see
# docs/AUTOMATION.md for the curl). Results are committed to data/.

on:
  schedule:
    - cron: "30 1 * * *" # daily 01:30 UTC (~7 AM IST)
  workflow_dispatch:
    inputs:
      domains:
        description: "Space-separated job domains"
        default: "sarkariresult.com sarkariexam.com sarkariresults.info freshersnow.com"
      max-pages:
        description: "List pages per domain"
        default: "5"
      max-jobs:
        description: "Detail pages per domain (0 = no limit)"
        default: "30"
      reason:
        description: "Why this run (rss-watch passes the new-item count)"
        default: ""
  repository_dispatch:
    types: [rss-new-items]
  workflow_call:
    inputs:
      domains:
        type: string
        default: "sarkariresult.com sarkariexam.com sarkariresults.info freshersnow.com"
      max-pages:
        type: string
        default: "5"
      max-jobs:
        type: string
        default: "30"
      reason:
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      DOMAINS: ${{ inputs.domains || 'sarkariresult.com sarkariexam.com sarkariresults.info freshersnow.com' }}
      MAX_PAGES: ${{ inputs.max-pages || '5' }}
      MAX_JOBS: ${{ inputs.max-jobs || '30' }}
      REASON: ${{ inputs.reason || github.event.client_payload.reason || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scrape job domains
        run: |
          mkdir -p data
          ok=0
          failed=0
          for d in $DOMAINS; do
            if node run-scrapper.js -d "$d" -f json -o "data/jobs-$d.json" \
              --max-pages "$MAX_PAGES" --max-jobs "$MAX_JOBS" --quiet; then
              ok=$((ok + 1))
            else
              failed=$((failed + 1))
              echo "::warning::scrape failed for $d"
            fi
          done
          echo "job domains: $ok ok, $failed failed"
          echo "JOBS_OK=$ok" >> "$GITHUB_ENV"
          echo "JOBS_FAILED=$failed" >> "$GITHUB_ENV"

      - name: Scrape papers lists
        run: |
          ok=0
          failed=0
          for d in upsc.gov.in adda247.com; do
            if node scrap-paper-list.js -d "$d" -f json -o "data/papers-$d.json" \
              --max-pages 5 --quiet; then
              ok=$((ok + 1))
            else
              failed=$((failed + 1))
              echo "::warning::papers list failed for $d"
            fi
          done
          echo "papers sources: $ok ok, $failed failed"
          echo "PAPERS_OK=$ok" >> "$GITHUB_ENV"
          echo "PAPERS_FAILED=$failed" >> "$GITHUB_ENV"

      - name: Build digest outputs
        run: |
          shopt -s nullglob
          files=(data/jobs-*.json)
          if [ ${#files[@]} -gt 0 ]; then
            jq -s 'add // []' "${files[@]}" > data/jobs-all.json
          else
            echo '[]' > data/jobs-all.json
          fi
          node job-digest.js -i data/jobs-all.json --state data/digest.state.json \
            --rss data/feed.xml --ics data/digest.ics --out data/digest.json --quiet

      - name: Write run metadata
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          node -e "var fs=require('fs');fs.writeFileSync('data/lastrun.json',JSON.stringify({at:new Date().toISOString(),trigger:process.env.TRIGGER,reason:process.env.REASON,domains:process.env.DOMAINS.split(' ')},null,2)+'\n')"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no changes" || (git commit -m "data: scrape ($TRIGGER, $REASON)" && git push)
        env:
          TRIGGER: ${{ github.event_name }}

      - name: Upload data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-data
          path: data/
          retention-days: 30

      - name: Verify the sweep collected something
        # Each domain is swallowed by a warning above so one dead site cannot
        # sink the sweep - but that also meant a run where EVERY domain failed
        # finished green and looked healthy. Fail loudly here instead, after
        # the data has been committed and the artifact uploaded, so a red run
        # still keeps whatever it managed to collect.
        #
        # Papers sources are beta and bot-guarded, so they warn only; a total
        # job-domain failure means the parsers or the upstream sites broke.
        run: |
          echo "job domains: ${JOBS_OK:-0} ok / ${JOBS_FAILED:-0} failed"
          echo "papers sources: ${PAPERS_OK:-0} ok / ${PAPERS_FAILED:-0} failed"
          if [ "${JOBS_OK:-0}" -eq 0 ]; then
            echo "::error::every job domain failed (${JOBS_FAILED:-0} of them); parsers or upstream sites are broken"
            exit 1
          fi
          if [ "${PAPERS_OK:-0}" -eq 0 ]; then
            echo "::warning::every papers source failed (beta sources, not failing the run)"
          fi

      - name: Alert on failure
        # `secrets` is NOT available in `if:` conditions (parse-time
        # validation rejects it with "Unrecognized named-value"), so the
        # alert is gated by `failure()` here and the secret check happens
        # inside the shell step instead.
        if: failure()
        env:
          TRIGGER: ${{ github.event_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::Telegram secrets not configured; skipping alert."
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="sarkari-scraper: scheduled scrape FAILED (${TRIGGER}). ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
