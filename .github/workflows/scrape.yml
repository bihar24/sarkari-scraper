name: Scrape

# Layer 2 — the scraper. Runs on a daily schedule as a fallback sweep, and
# on demand: manually (workflow_dispatch), from the RSS watcher
# (rss-watch.yml triggers it via `gh workflow run`), from reusable calls, or
# from ANY external watcher via the repository_dispatch API (see
# docs/AUTOMATION.md for the curl).
#
# Every current scrape is written to a staging directory first. A source file
# is only copied into data/ after it validates as a non-empty JSON array with
# at least one normalizable record. Empty or blocked results never replace a
# last-known-good committed file. The aggregate and data/catalog.json are
# rebuilt only from validated snapshots, and are verified before being
# committed. If verification fails the workflow fails without pushing a
# timestamp-only/empty update.

on:
  schedule:
    - cron: "30 1 * * *" # daily 01:30 UTC (~7 AM IST)
  workflow_dispatch:
    inputs:
      domains:
        description: "Space-separated job domains"
        default: "sarkariresult.com sarkariexam.com freshersnow.com"
      max-pages:
        description: "List pages per domain"
        default: "5"
      max-jobs:
        description: "Detail pages per domain (0 = no limit)"
        default: "30"
      reason:
        description: "Why this run (rss-watch passes the new-item count)"
        default: ""
  repository_dispatch:
    types: [rss-new-items]
  workflow_call:
    inputs:
      domains:
        type: string
        default: "sarkariresult.com sarkariexam.com freshersnow.com"
      max-pages:
        type: string
        default: "5"
      max-jobs:
        type: string
        default: "30"
      reason:
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      DOMAINS: ${{ inputs.domains || 'sarkariresult.com sarkariexam.com freshersnow.com' }}
      MAX_PAGES: ${{ inputs.max-pages || '5' }}
      MAX_JOBS: ${{ inputs.max-jobs || '30' }}
      REASON: ${{ inputs.reason || github.event.client_payload.reason || '' }}
      ATTEMPTED_AT: ${{ github.event.head_commit.timestamp || github.event.created_at || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prepare staging directory
        run: |
          rm -rf .scrape-staging
          mkdir -p .scrape-staging data

      - name: Scrape job domains into staging (validated before replacement)
        run: |
          set +e
          for d in $DOMAINS; do
            out=".scrape-staging/jobs-$d.json"
            rm -f "$out"
            echo "::notice::attempting jobs source $d"
            node run-scrapper.js -d "$d" -f json -o "$out" \
              --max-pages "$MAX_PAGES" --max-jobs "$MAX_JOBS" --quiet
            scrape_exit=$?
            ok=0
            if [ -f "$out" ]; then
              if node tools/validate-snapshot.js --input "$out" --kind job \
                > ".scrape-staging/validate-jobs-$d.log" 2>&1; then
                ok=1
                cp "$out" "data/jobs-$d.json"
                echo "::notice::$d validated job snapshot"
              else
                echo "::warning::$d: staged source is not a usable job snapshot"
                cat ".scrape-staging/validate-jobs-$d.log" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
                cat ".scrape-staging/validate-jobs-$d.log"
              fi
            else
              echo "::warning::$d: scraper produced no staged job output (exit $scrape_exit)"
            fi
            echo "$d $ok" >> .scrape-staging/job-status.txt
          done
          cat .scrape-staging/job-status.txt

      - name: Scrape paper lists into staging (beta, never erases previous)
        run: |
          set +e
          for d in upsc.gov.in adda247.com; do
            out=".scrape-staging/papers-$d.json"
            rm -f "$out"
            echo "::notice::attempting papers source $d"
            node scrap-paper-list.js -d "$d" -f json -o "$out" \
              --max-pages 5 --quiet
            scrape_exit=$?
            ok=0
            if [ -f "$out" ]; then
              if node tools/validate-snapshot.js --input "$out" --kind paper \
                > ".scrape-staging/validate-papers-$d.log" 2>&1; then
                ok=1
                cp "$out" "data/papers-$d.json"
                echo "::notice::$d validated paper snapshot"
              else
                echo "::warning::$d: staged paper output is not usable"
                cat ".scrape-staging/validate-papers-$d.log"
              fi
            else
              echo "::warning::$d: paper scraper produced no output (exit $scrape_exit)"
            fi
            echo "$d $ok" >> .scrape-staging/paper-status.txt
          done
          cat .scrape-staging/paper-status.txt

      - name: Write run status and last-run metadata
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          AT="${ATTEMPTED_AT:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}"
          node tools/run-status.js \
            --jobs .scrape-staging/job-status.txt \
            --papers .scrape-staging/paper-status.txt \
            --out data/run-status.json \
            --lastrun data/lastrun.json \
            --at "$AT" \
            --trigger "$TRIGGER" \
            --reason "$REASON" \
            --domains "$DOMAINS" 2>&1 || true

      - name: Rebuild validated aggregate snapshots
        run: |
          set +e
          node tools/build-aggregate.js --data data --kind job --output data/jobs-all.json
          echo "jobs aggregate exit: $?"
          node tools/build-aggregate.js --data data --kind paper --output data/papers-all.json
          echo "papers aggregate exit: $?"

      - name: Checkout pinned Bihar scheme tracker (offline/import, not scraped)
        uses: actions/checkout@v4
        with:
          repository: fossdot/bihar-scheme-tracker
          ref: 32b041f52a87f51e2c3d229bcc77e71518eff70c
          path: .tracker
          fetch-depth: 1

      - name: Build deployment catalogue (jobs + papers + pinned tracker)
        run: |
          set +e
          node tools/build-catalog.js \
            --store data/catalog.json \
            --data data \
            --tracker-dir .tracker \
            --tracker-ref 32b041f52a87f51e2c3d229bcc77e71518eff70c
          echo "catalog build exit: $?"

      - name: Build digest outputs when a job aggregate exists
        run: |
          set +e
          if [ -f data/jobs-all.json ]; then
            count=$(jq 'length' data/jobs-all.json 2>/dev/null || echo 0)
          else
            count=0
          fi
          if [ "$count" -gt 0 ]; then
            node job-digest.js -i data/jobs-all.json --state data/digest.state.json \
              --rss data/feed.xml --ics data/digest.ics --out data/digest.json --quiet
          else
            echo "::warning::No job aggregate; preserving existing digest/feed outputs."
          fi

      - name: Verify collection before commit
        run: |
          node tools/verify-catalog.js --store data/catalog.json --require job,scheme,policy --warn paper

      - name: Upload data and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-data-and-diagnostics
          path: |
            data/
            .scrape-staging/
            run-status.json
          retention-days: 30

      - name: Commit data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no changes" || (git commit -m "data: scrape ($TRIGGER, $REASON)" && git push)
        env:
          TRIGGER: ${{ github.event_name }}

      - name: Alert on failure
        # `secrets` is NOT available in `if:` conditions (parse-time
        # validation rejects it with "Unrecognized named-value"), so the
        # alert is gated by `failure()` here and the secret check happens
        # inside the shell step instead.
        if: failure()
        env:
          TRIGGER: ${{ github.event_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::Telegram secrets not configured; skipping alert."
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="sarkari-scraper: scheduled scrape FAILED (${TRIGGER}). ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
